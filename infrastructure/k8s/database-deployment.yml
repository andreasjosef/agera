apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: doe25-group-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: "ccpilot_app"
            - name: POSTGRES_DB
              value: "ccpilot_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-db-password
                  key: password
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: doe25-group-4
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432