

image: node:24-alpine

stages:
    - setup
    - test
    - docs


variables:
    PMPM_STORE_PATH: .pnpm-store

cache:
    key:
     files:
       - pnpm-lock.yaml
    paths:
       - $PNPM_STORE_PATH

before_script:
    - corepack enable
    - corepack prepare pnpm@latest --active
    - pnpm config set store-dir $PNPM_STORE_PATH


install_dependencies:
    stage: setup
    script:
      - pnpm install -fronzen-lockfile
    artifacts:
      paths:
        - node_modules/
        - app/*/node_modules/
        - packages/*/node_modules/
      expire_in: 1 hour


test_job:
    stage: test
    script:
    - node --experimental-strip-types --test math.test.ts

build_documentation:
    stage: docs 
    script:
      - apk add --no-cache python3
      - echo "Synkar README-filer..."
      - python3 scripts/syn_docs.py
      - echo "Bygger Starlight dokumentationen..."
      - pnpm --filter docs build

    artifacts:
      paths:
       - apps/docs/dist/
      expire_in: 1 week
